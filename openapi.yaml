openapi: 3.1.0
info:
  title: InBlack Top-Up API
  version: 1.0.0
  description: Customer, administrator, payment, and reconciliation APIs implemented by the service.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: The API process is alive.
  /readyz:
    get:
      summary: Dependency readiness probe
      responses:
        "200":
          description: PostgreSQL and Redis are available.
        "503":
          description: A required dependency is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /metrics:
    get:
      summary: Export Prometheus metrics
      responses:
        "200":
          description: Request latency, order states, and fulfillment job metrics.
          content:
            text/plain:
              schema:
                type: string
  /api/v1/products:
    get:
      summary: List active products
      responses:
        "200":
          description: Active products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /api/v1/products/{slug}:
    get:
      summary: Get an active product by SKU
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/orders/quote:
    post:
      summary: Calculate a signed-in user's order total without reserving inventory
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: Exact integer-satang quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          description: Invalid order or discount input.
        "401":
          description: A signed-in session is required.
  /api/v1/checkout/quote:
    post:
      summary: Alias for the signed-in order quote endpoint
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: Exact integer-satang quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          description: Invalid order or discount input.
        "401":
          description: A signed-in session is required.
  /api/v1/orders:
    post:
      summary: Create a pending order for the signed-in email address
      security:
        - sessionCookie: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        "201":
          description: Pending payment order and short-lived tracking token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          description: Stock, purchase limit, or voucher conflict.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Idempotency key was reused with a different request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: A signed-in session is required.
  /api/v1/checkout:
    post:
      summary: Alias for creating a pending order
      security:
        - sessionCookie: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        "201":
          description: Pending payment order and short-lived tracking token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          description: Stock, purchase limit, or voucher conflict.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Idempotency key was reused with a different request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: A signed-in session is required.
  /api/v1/orders/track:
    post:
      summary: Find an order using its ID and checkout email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, email]
              properties:
                order_id:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Order and a short-lived tracking token.
          content:
            application/json:
              schema:
                type: object
                required: [order, trackingToken]
                properties:
                  order:
                    $ref: "#/components/schemas/Order"
                  trackingToken:
                    type: string
        "404":
          description: Order not found or email does not match.
        "429":
          description: Tracking rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
  /api/v1/orders/{id}:
    get:
      summary: Get order details for the owner or an administrator
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details, line items, and status timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Authentication required.
        "404":
          description: Order not found or owned by another customer.
  /api/v1/orders/{id}/events:
    get:
      summary: Subscribe to order status events
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: Authorization
          required: true
          description: Bearer tracking token returned at order creation or tracking.
          schema:
            type: string
        - in: header
          name: Last-Event-ID
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Server-sent order events.
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: Invalid order ID or tracking token.
  /api/v1/webhooks/payment:
    post:
      summary: Receive a signed payment-provider event
      description: Verify X-IBM-Signature as HMAC-SHA256 over the exact raw body and timestamp, within a 300-second window.
      parameters:
        - in: header
          name: X-IBM-Signature
          required: true
          schema:
            type: string
            pattern: "^t=[0-9]+,v1=[a-f0-9]{64}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentEvent"
      responses:
        "200":
          description: Event accepted or already processed.
        "400":
          description: Invalid event.
        "401":
          description: Invalid or expired signature.
        "404":
          description: Order not found.
  /api/v1/auth/request-otp:
    post:
      summary: Send a one-time sign-in code
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: The sign-in code was sent.
        "429":
          description: Rate limit exceeded.
  /api/v1/auth/otp/request:
    post:
      summary: Send a one-time sign-in code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: The sign-in code was sent.
        "429":
          description: Rate limit exceeded.
  /api/v1/auth/verify-otp:
    post:
      summary: Verify a one-time code and create a session
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          description: Session cookie issued.
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          description: Code is invalid or expired.
  /api/v1/auth/otp/verify:
    post:
      summary: Verify a one-time code and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          description: Session cookie issued.
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          description: Code is invalid or expired.
  /api/v1/auth/me:
    get:
      summary: Get the current session user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current customer or administrator.
        "401":
          description: Session is missing or expired.
  /api/v1/auth/logout:
    post:
      summary: Revoke the current session
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Session revoked.
  /api/v1/account/orders:
    get:
      summary: List recent orders belonging to the signed-in account
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Up to 100 orders and associated refund-request status.
        "401":
          description: A signed-in session is required.
  /api/v1/account/orders/{id}/refund-request:
    post:
      summary: Request a refund for an eligible owned order
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 300
      responses:
        "202":
          description: Refund request queued for administrator review.
        "401":
          description: A signed-in session is required.
        "409":
          description: The order is not refundable or a request already exists.
  /api/v1/admin/products:
    get:
      summary: List all products for administrators
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Products including inactive entries.
        "403":
          description: Administrator role required.
    post:
      summary: Create a product
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, name, priceSatang, stock]
              properties:
                sku:
                  type: string
                  pattern: "^[A-Z0-9][A-Z0-9_-]{1,63}$"
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                priceSatang:
                  type: integer
                  minimum: 0
                stock:
                  type: integer
                  minimum: -1
                maxPerOrder:
                  type: integer
                  minimum: 1
                  default: 10
                maxPerEmail:
                  type: [integer, "null"]
                  minimum: 1
                maxOrderCount:
                  type: [integer, "null"]
                  minimum: 1
                active:
                  type: boolean
                  default: true
      responses:
        "201":
          description: Product created.
        "400":
          description: Product details are invalid.
        "403":
          description: Product-write permission required.
  /api/v1/admin/products/{sku}:
    patch:
      summary: Update product price, inventory, or availability
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: sku
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                priceSatang:
                  type: integer
                  minimum: 0
                stock:
                  type: integer
                  minimum: -1
                active:
                  type: boolean
      responses:
        "200":
          description: Updated product.
        "403":
          description: Administrator role required.
  /api/v1/admin/discount-codes:
    get:
      summary: List discount codes
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Discount codes and their current usage counts.
        "403":
          description: Staff order-read permission required.
    post:
      summary: Create a discount code
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, discountType, discountValue]
              properties:
                code:
                  type: string
                  pattern: "^[A-Z0-9_-]{2,40}$"
                discountType:
                  type: string
                  enum: [percent, fixed]
                discountValue:
                  type: integer
                  minimum: 0
                maxDiscountSatang:
                  type: [integer, "null"]
                  minimum: 0
                minOrderSatang:
                  type: integer
                  minimum: 0
                  default: 0
                maxUses:
                  type: [integer, "null"]
                  minimum: 1
                active:
                  type: boolean
                  default: true
      responses:
        "201":
          description: Discount code created.
        "400":
          description: Discount code details are invalid.
        "403":
          description: Product-write permission required.
  /api/v1/admin/discount-codes/{code}:
    patch:
      summary: Update a discount code's value, usage limit, or availability
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                discountValue:
                  type: integer
                  minimum: 0
                maxUses:
                  type: [integer, "null"]
                  minimum: 0
                active:
                  type: boolean
      responses:
        "200":
          description: Discount code updated.
        "400":
          description: Discount code values are invalid.
        "403":
          description: Product-write permission required.
        "404":
          description: Discount code not found.
  /api/v1/admin/orders:
    get:
      summary: Cursor-paginated order search for authorized staff
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: q
          schema:
            type: string
            maxLength: 100
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: A stable descending page and an optional next cursor.
          content:
            application/json:
              schema:
                type: object
                required: [orders, nextCursor]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  nextCursor:
                    type: [string, "null"]
        "403":
          description: Staff order-read permission required.
  /api/v1/admin/orders/{id}:
    get:
      summary: Get an order, timeline, webhook, fulfillment, and refund history
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order detail with role-sensitive PII.
        "404":
          description: Order not found.
  /api/v1/admin/orders/{id}/retry-fulfillment:
    post:
      summary: Queue a fulfillment retry for support staff
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Fulfillment retry queued.
        "403":
          description: Support permission required.
        "409":
          description: Order is not retryable or a refund has started.
  /api/v1/admin/orders/{id}/refund:
    post:
      summary: Queue an idempotent partial or full refund for finance staff
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 300
                amountSatang:
                  type: integer
                  minimum: 1
                  description: Defaults to the remaining refundable balance.
      responses:
        "202":
          description: Refund queued for the payment worker.
        "409":
          description: Refund would exceed the remaining paid balance.
  /api/v1/admin/dashboard:
    get:
      summary: Read live order, sales, and queue totals
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Dashboard aggregates.
  /api/v1/admin/audit-logs:
    get:
      summary: List audit logs (superadmin only)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Cursor-paginated audit log records.
  /api/v1/admin/users:
    get:
      summary: List users (superadmin only)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: User records with masked email where applicable.
  /api/v1/admin/users/{id}/role:
    patch:
      summary: Assign a role to a non-environment-managed user (superadmin only)
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [customer, viewer, support, finance, superadmin, admin]
      responses:
        "200":
          description: Role assigned.
        "409":
          description: Role is managed by environment configuration.
  /api/v1/admin/refund-requests:
    get:
      summary: List refund requests awaiting administrator review
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Pending customer refund requests.
        "403":
          description: Administrator role required.
  /api/v1/admin/refund-requests/{id}/{decision}:
    post:
      summary: Approve or reject a customer refund request
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: decision
          required: true
          schema:
            type: string
            enum: [approve, reject]
      responses:
        "200":
          description: The request was resolved.
        "403":
          description: Administrator role required.
        "409":
          description: The request has already been resolved or the order is not refundable.
  /api/v1/admin/reconciliation/import:
    post:
      summary: Import and reconcile a provider settlement CSV
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              description: CSV with event_id, order_id, amount_satang, type, and either currency or settled_at.
      responses:
        "201":
          description: Reconciliation batch and summary counts.
        "400":
          description: Invalid CSV.
        "403":
          description: Administrator role required.
  /api/v1/admin/reconciliation:
    get:
      summary: List recent reconciliation batches
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Recent batch summaries.
  /api/v1/_test/reset:
    post:
      summary: Reset database state and seed fixtures (APP_ENV=test only)
      responses:
        "200":
          description: Test state reset.
        "404":
          description: Disabled outside the test environment.
  /api/v1/admin/reconciliation/{id}:
    get:
      summary: Get a reconciliation batch and its comparison rows
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Batch report.
        "404":
          description: Batch not found.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: inblack_session
  schemas:
    Product:
      type: object
      required: [sku, name, price_satang, stock, max_per_order]
      properties:
        sku:
          type: string
        name:
          type: string
        price_satang:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: -1
        max_per_order:
          type: integer
          minimum: 1
        max_per_email:
          type: [integer, "null"]
          minimum: 1
        max_order_count:
          type: [integer, "null"]
          minimum: 1
    OrderRequest:
      type: object
      required: [email, paymentMethod]
      properties:
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 10
        email:
          type: string
          format: email
        playerId:
          type: string
        discountCode:
          type: [string, "null"]
        paymentMethod:
          type: string
          enum: [promptpay, truemoney, card]
        items:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [sku, quantity, playerId]
            properties:
              sku:
                type: string
              quantity:
                type: integer
                minimum: 1
                maximum: 10
              playerId:
                type: string
    QuoteRequest:
      type: object
      properties:
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 10
        playerId:
          type: string
        discountCode:
          type: [string, "null"]
        paymentMethod:
          type: string
          enum: [promptpay, truemoney, card]
        items:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku:
                type: string
              quantity:
                type: integer
                minimum: 1
                maximum: 10
              playerId:
                type: string
      oneOf:
        - required: [sku, quantity]
        - required: [items]
    Quote:
      type: object
      required: [sku, productName, quantity, subtotalSatang, discountSatang, feeSatang, vatSatang, totalSatang]
      properties:
        sku:
          type: string
        productName:
          type: string
        quantity:
          type: integer
        subtotalSatang:
          type: integer
        discountSatang:
          type: integer
        feeSatang:
          type: integer
        vatSatang:
          type: integer
        totalSatang:
          type: integer
        items:
          type: array
          items:
            type: object
            required: [sku, productName, quantity, unitPriceSatang]
            properties:
              sku:
                type: string
              productName:
                type: string
              quantity:
                type: integer
                minimum: 1
              unitPriceSatang:
                type: integer
                minimum: 0
    Order:
      allOf:
        - $ref: "#/components/schemas/Quote"
        - type: object
          required: [id, status, paymentMethod]
          properties:
            id:
              type: string
              pattern: "^ORD-[0-9]{13}-[0-9]{3}$"
            email:
              type: string
            playerId:
              type: string
            status:
              type: string
            paymentMethod:
              type: string
            trackingToken:
              type: string
    PaymentEvent:
      type: object
      required: [event_id, type, order_id, amount_satang, currency, occurred_at]
      properties:
        event_id:
          type: string
        type:
          type: string
          enum: [payment.succeeded, payment.failed, payment.refunded]
        order_id:
          type: string
        amount_satang:
          type: integer
          minimum: 0
        currency:
          const: THB
        occurred_at:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties:
